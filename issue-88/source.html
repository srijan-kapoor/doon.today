<script>
(()=>{
 const root=document.getElementById('doon-approved');
 const cats=['Music','Culture','Other','Workshop','Outdoors','Wellness','Books','Comedy','Meetups','Fitness','Live shows','Art','Food','Games'];
 const areas=['Anywhere in Dehradun','Garhi Cantt','Rajpur','Maldevta','Malsi','Sahastradhara','Clement Town'];
 const events=[
 {day:29,month:'Oct',time:'7:00 pm',title:'Virasat: Vocal recital by Siddharth Belmannu',venue:'Himalayan Cultural Centre',area:'Garhi Cantt',cats:['Music','Culture']},
 {day:29,month:'Oct',time:'8:30 pm',title:'Virasat: Veena recital by Rajhesh Vaidhya',venue:'Himalayan Cultural Centre',area:'Garhi Cantt',cats:['Music','Culture']},
 {day:30,month:'Oct',time:'7:00 pm',title:'Diwali Diwas Hangout',venue:'Kytes Rooftop Cafe',area:'Sahastradhara',cats:['Books','Food'],pick:true},
 {day:30,month:'Oct',time:'8:00 pm',title:'Virasat: Indian Ocean LIVE',venue:'Himalayan Cultural Centre',area:'Garhi Cantt',cats:['Music','Culture']},
 {day:31,month:'Oct',time:'9:00 am',title:'Rajpur Nature Festival',venue:'MDDA Park',area:'Rajpur',cats:['Meetups'],free:true,pick:true},
 {day:31,month:'Oct',time:'4:00 pm',title:'Ghar: An Open Mic for Words',venue:'Tapri — The Teafe',area:'',cats:['Comedy'],price:'₹300+'},
 {day:31,month:'Oct',time:'8:00 pm',title:'LITCHI India Tour',venue:'Chica',area:'Rajpur',cats:['Live shows'],price:'₹800+'},
 {day:31,month:'Oct',time:'9:00 pm',title:'Starry Night at Rajpur Nature Fest',venue:'MDDA Park',area:'Rajpur',cats:['Other'],free:true,pick:true},
 {day:1,month:'Nov',time:'5:45 am',title:'Tachila Temple Trek',venue:'Meetup at Maldevta Temple',area:'Maldevta',cats:['Outdoors','Meetups'],pick:true},
 {day:1,month:'Nov',time:'4:30 pm',title:'Melophile: Daft Punk Album Listening Meet',venue:'Maldevta',area:'Maldevta',cats:['Music'],free:true,pick:true},
 {day:2,month:'Nov',time:'6:00 am',title:'200 hour yoga in Dehradun',venue:'Hariom Colony, Upper Tunwala',area:'',cats:['Workshop','Wellness'],price:'₹17,500+'},
 {day:27,month:'Nov',time:'10:00 am',title:'Dehradun Literature Festival',venue:'Doon International School',area:'',cats:['Books','Culture']}
 ];
 const defaults=()=>({date:'Upcoming',cats:[],area:areas[0],free:false,pick:false});
 const copy=x=>JSON.parse(JSON.stringify(x));
 const saved={};
 const states={}; const ui={};
 const designIds=['quick','mobile'];
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function match(e,s,ignoreCats=false){return(s.date==='Upcoming'||s.date==='Today'&&e.day===29&&e.month==='Oct'||s.date==='Tomorrow'&&e.day===30&&e.month==='Oct'||s.date==='Weekend'&&(e.day===31&&e.month==='Oct'||e.day===1&&e.month==='Nov'))&&(ignoreCats||!s.cats.length||s.cats.some(c=>e.cats.includes(c)))&&(s.area===areas[0]||s.area===e.area)&&(!s.free||e.free)&&(!s.pick||e.pick)}
 function checks(s){return `<div class="checks">${cats.map(c=>`<label class="check"><input type="checkbox" data-cat="${c}" ${s.cats.includes(c)?'checked':''}>${c}<span>${events.filter(e=>match(e,s,true)&&e.cats.includes(c)).length}</span></label>`).join('')}</div>`}
 function count(c,s){return events.filter(e=>match(e,s,true)&&e.cats.includes(c)).length}
 function chip(c,s){return `<button class="cursor-interaction" data-category="${c}" aria-pressed="${s.cats.includes(c)}">${s.cats.includes(c)?icon('check'):''}${c}<span>${count(c,s)}</span></button>`}
 function bottom(s,id){return `<div class="filter-bottom">${toggles(s)}${area(s,id)}</div>`}
 function area(s,id){return `<div class="area"><label for="${id}-area">Area</label><select id="${id}-area" data-area aria-label="Area">${areas.map(a=>`<option ${s.area===a?'selected':''}>${a}</option>`).join('')}</select></div>`}
 function dates(s){return `<div class="dates" role="group" aria-label="When">${['Upcoming','Today','Tomorrow','Weekend'].map(d=>`<button class="cursor-interaction" data-date="${d}" aria-pressed="${s.date===d}">${d}</button>`).join('')}</div>`}
 function toggles(s){return `<div class="pills"><button class="toggle pick cursor-interaction" data-toggle="pick" aria-pressed="${s.pick}">${icon('sparkles')}Community picks</button><button class="toggle cursor-interaction" data-toggle="free" aria-pressed="${s.free}">Free only</button></div>`}
 function selections(s){const items=[...(s.date!=='Upcoming'?[['date',s.date]]:[]),...s.cats.map(c=>['cat',c]),...(s.free?[['free','Free only']]:[]),...(s.pick?[['pick','Community picks']]:[]),...(s.area!==areas[0]?[['area',s.area]]:[])];return `<div class="selection" aria-label="Applied filters">${items.map(([k,v])=>`<button class="cursor-interaction" data-remove="${k}" data-value="${esc(v)}" aria-label="Remove ${esc(v)} filter">${esc(v)} ${icon('x')}</button>`).join('')}${items.length?'<button class="quiet cursor-interaction" data-reset>Clear all</button>':''}</div>`}
 function results(s){let list=events.filter(e=>match(e,s));return `<div class="result-head"><h2>Events <span class="result-count">${list.length}</span></h2><span class="subtle" role="status" aria-live="polite">${list.length} matching sample events</span></div>${list.length?list.slice(0,4).map(e=>`<article class="event"><div class="event-day">${e.month}<strong>${e.day}</strong></div><div><h3>${esc(e.title)}</h3><p>${e.time} · ${esc(e.venue)}${e.area?' · '+e.area:''}</p><div class="event-tags">${e.cats.join(' · ')}${e.pick?' · Community pick':''}</div></div><span class="price">${e.free?'Free':e.price||''}</span></article>`).join('')+(list.length>4?`<p class="subtle" style="padding:12px 0">+ ${list.length-4} more matching sample events</p>`:''):'<div class="empty"><h3>No events match these filters</h3><p>Try another date, category, or area.</p><button class="cursor-interaction" data-reset>Clear all filters</button></div>'}`}
 const sample='<div class="sample">Interactive prototype · 12 sample events · Counts and community picks are illustrative.</div>';
 function render(id){const el=root.querySelector(`[data-design="${id}"]`),s=states[id],u=ui[id];
 el.classList.toggle('sheet-open',id==='mobile'&&u.open);
 let top=`<header class="top"><span class="brand">doon.today</span><div class="navtext"><b>Events</b><span>Calendars</span><span>About</span></div><button class="theme-button" data-theme-toggle aria-label="Switch to ${root.dataset.theme==='dark'?'light':'dark'} mode">${icon(root.dataset.theme==='dark'?'sun':'moon')}</button></header><div class="hero"><div class="eyebrow">DEHRADUN · UTTARAKHAND</div><h1>What’s happening<br>in Doon?</h1><p>A quiet, useful calendar of events worth knowing about.</p></div>${dates(s)}`;
 if(id==='quick')el.innerHTML=top+`<section aria-label="Categories"><div class="category-heading"><h2>What are you in the mood for?</h2><p>Choose one or more</p></div><div class="quick-row"><button class="cursor-interaction" data-cats-clear aria-pressed="${!s.cats.length}">All</button>${['Music','Culture','Outdoors','Workshop','Comedy'].map(c=>chip(c,s)).join('')}<button class="cursor-interaction" data-open aria-expanded="${u.open}">${u.open?'Fewer categories':'All 14 categories'} ${icon(u.open?'chevron-up':'chevron-down')}</button></div>${u.open?`<div class="category-panel"><div class="category-heading"><h2>All categories</h2><span class="subtle">Match any selected category</span></div>${checks(s)}</div>`:''}</section>${bottom(s,id)}${selections(s)}${results(s)}${sample}`;
 if(id==='mobile'){let d=u.draft||s;const n=s.cats.length+Number(s.free)+Number(s.pick)+Number(s.area!==areas[0]);el.innerHTML=`<div class="mobile-page" ${u.open?'inert':''}>${top}<div class="toolbar"><button data-open aria-expanded="${u.open}">${icon('sliders-horizontal')}Filters${n?' · '+n:''}</button><button class="toggle pick" data-toggle="pick" aria-pressed="${s.pick}">${icon('sparkles')}Community picks</button></div><div class="mobile-results">${selections(s)}${results(s)}</div>${sample}</div>${u.open?`<div class="modal-layer"><div class="backdrop" data-backdrop aria-hidden="true"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="grab"></div><div class="pop-head"><h2 id="sheet-title">Make it your kind of day</h2><button data-close aria-label="Cancel filter changes">${icon('x')}</button></div><div class="sheet-body"><fieldset><legend>Categories · choose any</legend>${checks(d)}</fieldset><fieldset><legend>Area</legend>${area(d,id)}</fieldset><fieldset><legend>Preferences</legend><label class="check"><input type="checkbox" data-pref="pick" ${d.pick?'checked':''}>Community picks</label><label class="check"><input type="checkbox" data-pref="free" ${d.free?'checked':''}>Free only</label></fieldset></div><div class="sheet-footer"><button class="quiet" data-draft-reset>Reset</button><button class="solid" data-apply>Show ${events.filter(e=>match(e,d)).length} ${events.filter(e=>match(e,d)).length===1?'event':'events'} ${icon('arrow-right')}</button></div></section></div>`:''}`}
 if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
 }
 function save(){}
 function restore(data){for(const id of designIds){const v=data[id];states[id]=v&&Array.isArray(v.cats)?{...defaults(),...v,cats:v.cats.filter(c=>cats.includes(c))}:defaults();ui[id]={open:id==='mobile'||id==='grouped',draft:id==='mobile'?copy(states[id]):null,query:''};render(id)}}
 restore(saved);
 root.addEventListener('click',ev=>{if(ev.target.hasAttribute('data-backdrop')){ui.mobile.open=false;ui.mobile.draft=null;render('mobile');root.querySelector('[data-design="mobile"] [data-open]').focus();return}const b=ev.target.closest('button');if(!b)return;const el=b.closest('[data-design]');if(!el)return;const id=el.dataset.design,s=states[id],u=ui[id];
 if(b.hasAttribute('data-theme-toggle')){root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';for(const key of designIds)render(key);el.querySelector('[data-theme-toggle]').focus();return}
 if(b.hasAttribute('data-open')){u.open=!u.open;if(id==='mobile'&&u.open)u.draft=copy(s)}
 if(b.hasAttribute('data-close')){u.open=false;u.draft=null}
 if(b.hasAttribute('data-apply')){states[id]=copy(u.draft);u.open=false;u.draft=null}
 if(b.dataset.date){s.date=b.dataset.date;if(u.draft)u.draft.date=s.date}
 if(b.dataset.toggle)s[b.dataset.toggle]=!s[b.dataset.toggle];
 if(b.hasAttribute('data-reset')){states[id]=defaults();u.open=false}
 if(b.hasAttribute('data-draft-reset'))u.draft={...defaults(),date:s.date};
 if(b.hasAttribute('data-cats-clear'))s.cats=[];
 if(b.dataset.category){const c=b.dataset.category;s.cats=s.cats.includes(c)?s.cats.filter(x=>x!==c):[...s.cats,c]}
 if(b.dataset.remove){const k=b.dataset.remove;if(k==='cat')s.cats=s.cats.filter(c=>c!==b.dataset.value);else s[k]=defaults()[k]}
 render(id);save();if(b.hasAttribute('data-open')&&u.open)el.querySelector(id==='mobile'?'[data-close]':'input')?.focus();if(b.hasAttribute('data-close')||b.hasAttribute('data-apply'))el.querySelector('[data-open]')?.focus();
 });
 root.addEventListener('change',ev=>{const t=ev.target,el=t.closest('[data-design]');if(!el)return;const id=el.dataset.design,u=ui[id],s=id==='mobile'&&u.open?u.draft:states[id];let selector;
 if(t.hasAttribute('data-search'))return;
 if(t.dataset.cat){s.cats=t.checked?[...s.cats,t.dataset.cat]:s.cats.filter(c=>c!==t.dataset.cat);selector=`[data-cat="${t.dataset.cat}"]`}
 if(t.hasAttribute('data-area')){s.area=t.value;selector='[data-area]'}
 if(t.dataset.pref){s[t.dataset.pref]=t.checked;selector=`[data-pref="${t.dataset.pref}"]`}
 render(id);if(selector)el.querySelector(selector)?.focus();save();
 });
 root.addEventListener('keydown',ev=>{if(ev.key==='Escape'){const el=ev.target.closest('[data-design]');if(el){ev.preventDefault();ui[el.dataset.design].open=false;ui[el.dataset.design].draft=null;render(el.dataset.design);el.querySelector('[data-open]')?.focus()}}if(ev.key==='Tab'&&ui.mobile.open){const sheet=root.querySelector('[data-design="mobile"] .sheet');if(!sheet||!sheet.offsetParent)return;const items=[...sheet.querySelectorAll('button,input,select')],first=items[0],last=items[items.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});
})();
