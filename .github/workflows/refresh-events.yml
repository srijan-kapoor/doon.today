name: Refresh events
on:
  workflow_dispatch:
  schedule:
    # Every 8 hours, at about 05:47, 13:47 and 21:47 IST. GitHub starts scheduled runs late when many repos
    # schedule the same minute (:00 and :30 are the busiest; on 19 Oct the 06:00 run started at 10:32), so
    # this uses an off-peak minute. Delays of a few minutes are normal; the health check covers longer gaps.
    - cron: '17 0,8,16 * * *'
permissions:
  contents: write
  # For opening review issues for new r/Dehradun leads.
  issues: write
concurrency:
  # Shared with refresh-primary.yml so the two jobs never commit to data/ at the same time.
  group: refresh-events
  cancel-in-progress: false
jobs:
  refresh:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # District returns 403 to GitHub-hosted runners (bot protection on datacenter IPs). It is fetched
      # by refresh-primary.yml or scripts/refresh-primary-local.sh instead.
      INGEST_SKIP: district
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Test ingest adapters
        run: npm test
      - name: Fetch and normalize events
        env:
          # Instagram leads (ingest/sources/instagram.mjs). Without these the source keeps its queued leads
          # and fetches nothing. The handle list is a secret so it stays out of the public logs.
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_HANDLES: ${{ secrets.INSTAGRAM_HANDLES }}
        run: npm run ingest
      - name: Validate event data
        run: npm run validate:data
      - name: Build site
        run: npm run build
      - name: Commit changed event data
        run: |
          if git diff --quiet -- data/; then
            echo "No event changes"
            exit 0
          fi
          git config user.name "doon.today bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh events"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Sync the review queue with GitHub issues
        # Opens an issue for each new Reddit lead and closes issues already decided with npm run review.
        # A GitHub API hiccup here should not fail the refresh.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-lead-issues.mjs
      - name: Check primary sources are fresh
        # Last on purpose: the data above is already committed. This turns the run red when District has
        # not refreshed for 48h, so a dead self-hosted runner is not silent.
        run: npm run check:health
